    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />

    <link rel="canonical" href="https://sitesurelabs.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SiteSureLabs" />
    <meta property="og:title" content="SiteSureLabs | AI Products & Enterprise Engineering" />
    <meta property="og:description" content="AI-powered products and intelligent systems that help businesses see more clearly, work smarter and turn complex problems into actionable outcomes." />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies the saved theme before first paint so there is no flash. Its SHA-256 is allow-listed in nginx.conf's
         Content-Security-Policy; scripts/postbuild.mjs fails the build if the two drift apart. Keep it on one line. -->
    <script>(function(){var t='dark';try{var s=localStorage.getItem('ssl-theme');if(s==='light'||s==='dark')t=s}catch(e){}document.documentElement.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#F7F4EF')}})()</script>
    <style>html{background:#141619;color-scheme:dark}html[data-theme=light]{background:#F7F4EF;color-scheme:light}body{margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:40px;font-family:system-ui;color:#F4F1EC;background:#141619">

        <p>AI-powered products and custom AI engineering. Products: Anviksha, SiteVision, Digi Reco, Parichay. Please enable JavaScript to view this site, or contact us at hello@sitesurelabs.com.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
