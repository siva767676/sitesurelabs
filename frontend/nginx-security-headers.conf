# Security headers, shared by every location in nginx.conf.
# nginx does NOT inherit add_header into a location that defines its own add_header, so each such location includes this
# file instead of repeating (and silently dropping) the headers. Installed as /etc/nginx/snippets/security-headers.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Turnstile (optional) is the only third-party origin the site can load. The sha256 allows the one inline script in
# index.html (applies the saved light/dark theme before first paint); scripts/postbuild.mjs fails the build if it drifts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/SbYM/O3orBojkgzvV92DrGu1fGJtVQ3mT/9AU9CGmU=' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
