<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141619" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--seo-head: per-route <title>, description, canonical, Open Graph and Twitter tags (from components/ui/Seo.tsx) are inserted here by scripts/postbuild.mjs-->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SiteSureLabs: intelligence engineered for the real world." />
    <!-- Applies the saved theme before first paint so there is no flash. Its SHA-256 is allow-listed in nginx.conf's
         Content-Security-Policy; scripts/postbuild.mjs fails the build if the two drift apart. Keep it on one line. -->
    <script>(function(){var t='dark';try{var s=localStorage.getItem('ssl-theme');if(s==='light'||s==='dark')t=s}catch(e){}document.documentElement.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#F7F4EF')}})()</script>
    <style>html{background:#141619;color-scheme:dark}html[data-theme=light]{background:#F7F4EF;color-scheme:light}body{margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- Pages are prerendered, so the content is already in the HTML. This only un-hides text and images that the
           scroll animations start hidden, for visitors who browse without JavaScript. -->
      <style>[style*="opacity:0"],[style*="opacity: 0"],[style*="clip-path"]{opacity:1!important;transform:none!important;clip-path:none!important}</style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
