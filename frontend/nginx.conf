# Static site + reverse proxy to the FastAPI service. Mounted as /etc/nginx/conf.d/default.conf.
# TLS, HSTS and the www -> apex redirect are handled by the layer in front of this container (see
# docs/SEO_DEPLOYMENT_CHECKLIST.md); this server speaks plain HTTP on port 80.

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Redirects below are relative ("Location: /about"), so a request that arrived over https at the proxy is never
    # bounced to http:// by this container.
    absolute_redirect off;

    # --- compression ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # --- security headers (server level, for redirects and error pages) ---
    include /etc/nginx/snippets/security-headers.conf;

    # --- API: never indexable; robots.txt only asks crawlers not to fetch it ---
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=api_per_ip burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, not appended: clients cannot spoof it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # --- hashed build assets: cache forever ---
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- media (stills + demo videos); nginx serves byte ranges so video can seek ---
    location ^~ /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # --- renamed URLs: one permanent hop straight to the new address (with or without a trailing slash) ---
    location = /products/sitevision  { return 301 /products/site-vision; }
    location = /products/sitevision/ { return 301 /products/site-vision; }

    # --- pages: every route is prerendered to <route>/index.html by scripts/postbuild.mjs ---
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";

        # One URL per page. /about/ and /about/index.html both 301 to /about. These test $request_uri (the URL the
        # client asked for), which try_files' internal lookup of /about/index.html never changes, so there is no loop.
        if ($request_uri ~ ^/(?:([^?]*)/)?index\.html(\?.*)?$) { return 301 /$1; }
        if ($request_uri ~ ^(/[^?]*[^/?])/+(\?.*)?$)      { return 301 $1$is_args$args; }

        try_files $uri $uri/index.html =404;
    }

    # Unknown URL: real 404 status, and the prerendered NotFound page (noindex) is the body.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
