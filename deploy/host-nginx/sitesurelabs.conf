# sitesurelabs.com landing page: the site itself runs in a container published on 127.0.0.1:8080.
# Managed by SiteVision setup; certbot adds the 443 listener and the HTTP->HTTPS redirect once DNS resolves.
# 2026-11-09: one canonical host. www.sitesurelabs.com answers with a single 301 to sitesurelabs.com, and HSTS is sent
# on the main host. Backup of the previous file: sitesurelabs.conf.bak-20261109
server {
    server_name sitesurelabs.com;

    # HSTS: browsers use HTTPS for this host for a year. No includeSubDomains or preload yet (hard to undo).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sitesurelabs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sitesurelabs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www (HTTPS) -> main host, one permanent redirect that keeps the path and query string.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.sitesurelabs.com;

    ssl_certificate /etc/letsencrypt/live/sitesurelabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitesurelabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sitesurelabs.com$request_uri;
}

# HTTP (both names) -> HTTPS main host in one hop.
server {
    listen 80;
    listen [::]:80;
    server_name sitesurelabs.com www.sitesurelabs.com;
    return 301 https://sitesurelabs.com$request_uri;
}
