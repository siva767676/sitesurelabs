# Production-style stack: nginx (static site + /api proxy) -> FastAPI -> PostgreSQL.
#   cp .env.example .env   # then fill in the values
#   docker compose up -d --build
# The site is served on http://localhost:${WEB_PORT:-8080}. Put TLS in front (Caddy, Cloudflare, a load balancer).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitesurelabs
      POSTGRES_USER: sitesure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitesure -d sitesurelabs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://sitesure:${POSTGRES_PASSWORD}@db:5432/sitesurelabs
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HEADERS: "true"          # nginx overwrites X-Forwarded-For with the real client address
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}

  web:
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
