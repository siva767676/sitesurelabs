version: 0.2
# Builds the SiteSureLabs frontend and backend images, VERIFIES the frontend image (nginx -t and the HTTP status and
# redirect matrix), and only then pushes both to ECR. Nothing is pushed if any check fails.
phases:
  build:
    commands:
      - |
        set -uo pipefail
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        FE=sitesurelabs-frontend
        BE=sitesurelabs-backend
        echo "== building commit ${IMAGE_TAG}"
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY" || exit 1
        docker build --build-arg VITE_TURNSTILE_SITE_KEY="" -t "$FE:$IMAGE_TAG" ./frontend || exit 1
        docker build -t "$BE:$IMAGE_TAG" ./backend || exit 1

        echo "== nginx -t on the frontend image"
        docker run --rm --add-host api:127.0.0.1 "$FE:$IMAGE_TAG" nginx -t || { echo "FAIL nginx -t"; exit 1; }

        echo "== start the frontend image and run the status/redirect matrix"
        docker run -d --name feweb --add-host api:127.0.0.1 -p 8081:80 "$FE:$IMAGE_TAG" >/dev/null
        for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/robots.txt)" = "200" ] && break; sleep 1; done
        FAIL=0
        t() { # path wantStatus [wantLocation]
          code=$(curl -s -o /tmp/b -D /tmp/h -w '%{http_code}' "http://127.0.0.1:8081$1")
          loc=$(grep -i '^location:' /tmp/h | head -1 | sed 's/^[Ll]ocation: *//' | tr -d '\r')
          if [ "$code" != "$2" ] || { [ -n "${3:-}" ] && [ "$loc" != "$3" ]; }; then echo "FAIL $1 got $code '$loc' want $2 '${3:-}'"; FAIL=1; else echo "ok   $1 $code ${loc}"; fi
        }
        hdr() { grep -qi "$1" /tmp/h && echo "ok   header $1" || { echo "FAIL missing header $1"; FAIL=1; }; }
        body() { grep -q "$1" /tmp/b && echo "ok   body has $1" || { echo "FAIL body lacks $1"; FAIL=1; }; }

        t / 200; hdr 'content-security-policy'; hdr 'x-frame-options'; hdr 'x-content-type-options'; hdr 'referrer-policy'; hdr 'permissions-policy'; hdr 'cache-control: no-cache'; body '<h1'
        for p in /products /services /about /contact /blog /products/anviksha /products/site-vision /products/digi-reco /products/parichay /products/progress-tracker /blog/digital-construction-inspection-guide /blog/manual-vs-ai-construction-inspection /blog/360-degree-construction-documentation; do t "$p" 200; body '<h1'; done
        t /about 200; body 'rel="canonical" href="https://sitesurelabs.com/about"'
        t /privacy 200; body 'noindex'; t /terms 200; body 'noindex'
        t /products/progress-tracker 200; body 'noindex'
        t /about/ 301 /about
        t /about/index.html 301 /about
        t /index.html 301 /
        't' '/about/?x=1' 301 '/about?x=1'
        t /products/sitevision 301 /products/site-vision
        t /products/sitevision/ 301 /products/site-vision
        t /products/does-not-exist 404; body 'noindex'
        t /nope 404; t /blog/nope 404; t /404.html 404
        t /sitemap.xml 200; N=$(grep -o '<loc>' /tmp/b | wc -l); [ "$N" = "13" ] && echo "ok   sitemap has 13 urls" || { echo "FAIL sitemap has $N urls, want 13"; FAIL=1; }
        t /robots.txt 200; t /llms.txt 200
        ASSET=$(docker exec feweb sh -c 'ls /usr/share/nginx/html/assets | grep "^c-" | head -1')
        t "/assets/$ASSET" 200; hdr 'immutable'; hdr 'content-security-policy'
        t /assets/missing.js 404
        t /media/anviksha-demo-720.mp4 200; hdr 'content-security-policy'; hdr 'accept-ranges'
        t /media/anviksha-demo.mp4 200
        t /api/health 502; hdr 'x-robots-tag: noindex'
        docker rm -f feweb >/dev/null 2>&1
        if [ "$FAIL" != "0" ]; then echo "== MATRIX FAILED: nothing will be pushed"; exit 1; fi
        echo "== MATRIX PASSED"

        echo "== backend smoke test (import the app)"
        docker run --rm -e APP_ENV=production -e IP_HASH_SALT=ci-only -e DATABASE_URL=sqlite:////tmp/ci.db "$BE:$IMAGE_TAG" python -c "from app.main import app; print('backend import ok')" || echo "WARN backend import check failed (not blocking: backend is unchanged)"

        echo "== push to ECR"
        for NAME in $FE $BE; do
          docker tag "$NAME:$IMAGE_TAG" "$REGISTRY/$NAME:$IMAGE_TAG"
          docker tag "$NAME:$IMAGE_TAG" "$REGISTRY/$NAME:latest"
          docker push "$REGISTRY/$NAME:$IMAGE_TAG" || exit 1
          docker push "$REGISTRY/$NAME:latest" || exit 1
        done
        echo "== DONE"
        for NAME in $FE $BE; do aws ecr describe-images --repository-name "$NAME" --image-ids imageTag="$IMAGE_TAG" --region "$AWS_DEFAULT_REGION" --query 'imageDetails[0].[imageDigest,imageSizeInBytes]' --output text; done
