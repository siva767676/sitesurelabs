# Production-style stack: nginx (static site + /api proxy) -> FastAPI, which stores enquiries in SQLite.
#   cp .env.example .env   # then fill in the values
#   docker compose up -d --build
# The site is served on http://localhost:${WEB_PORT:-8080}. Put TLS in front (Caddy, Cloudflare, a load balancer).
# The database is /data/sitesurelabs.db in the api container, on the "data" volume. Back it up (see the README).

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/sitesurelabs.db
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HEADERS: "true"          # nginx overwrites X-Forwarded-For with the real client address
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - data:/data                          # keeps the enquiries when the container is rebuilt or replaced

  web:
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  data:
